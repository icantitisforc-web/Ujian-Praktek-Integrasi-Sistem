version: '3.8'

services:
  # 3. Container Divisi Pendistribusian
  container_pendistribusian:
    build: .
    container_name: db_pendistribusian
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_PENDISTRIBUSIAN}
      MYSQL_USER: ${USER_PENDISTRIBUSIAN}
      MYSQL_PASSWORD: ${PASS_PENDISTRIBUSIAN}
    ports:
      - "${PORT_PENDISTRIBUSIAN}:3306"
    volumes:
      - vol_pendistribusian:/var/lib/mysql
      - ./sql_init/init-pendistribusian.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ZIS-network

volumes:
  vol_pendistribusian:

networks:
  ZIS-network:
    driver: bridge