version: '3.8'

services:
  # 1. Container Divisi Penghimpunan
  container_penghimpunan:
    build: .
    container_name: db_penghimpunan
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_PENGHIMPUNAN}
      MYSQL_USER: ${USER_PENGHIMPUNAN}
      MYSQL_PASSWORD: ${PASS_PENGHIMPUNAN}
    ports:
      - "${PORT_PENGHIMPUNAN}:3306"
    volumes:
      - vol_penghimpunan:/var/lib/mysql
      - ./sql_init/init-penghimpunan.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ZIS-network

volumes:
  vol_penghimpunan:

networks:
  ZIS-network:
    driver: bridge
